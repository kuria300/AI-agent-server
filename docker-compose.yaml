# version: '3.8'
services:
  # fastapi app
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: KingsLanding_app
    ports:
      - "8000:8000"
    env_file:
      - .env
      # app settings
    environment:
      # override just the ollama url
      # host.docker.internal = your laptop from inside docker
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_HOST: redis
      REDIS_DB: ${REDIS_DB}
      REDIS_TTL: ${REDIS_TTL}
      DATABASE_URL: ${DATABASE_URL}

    extra_hosts:
      - "host.docker.internal:host-gateway" # this is needed for linux to access host machine from inside docker container
    develop:
      watch:
       - action: sync
         path: ./app
         target: /app/app

       - action: sync
         path: ./main.py
         target: /app/main.py

       - action: rebuild
         path: ./pyproject.toml

       - action: rebuild
         path: ./uv.lock

    depends_on:
      redis:
         condition: service_healthy
      postgres:
         condition: service_healthy
    networks:
      - kingslanding_network

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kingslanding_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    # writes to disk only so it servives restarts and append every secomd
    command: >
      redis-server
      --appendonly yes      
      --appendfsync everysec
      --requirepass hello123

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6379 -a hello123 ping || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 5s

    networks:
      - kingslanding_network

    restart: unless-stopped
  

  postgres:
    image: pgvector/pgvector:pg16
    container_name: kingslanding_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql  
      # this run on startup thus creating the pgvector extension and setup tables associated with storing emebdding
      # This mechanism works by placing .sql files into a specific folder inside the container called /docker-entrypoint-initdb.d/.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s  

    networks:
      - kingslanding_network
    

volumes:
  redis_data:
  pgdata:

networks:
  kingslanding_network:
    driver: bridge

        
    
      

